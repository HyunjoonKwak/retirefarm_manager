# GHCR 이미지 기반 프로덕션 배포용 (NAS용)
# 사용법: docker-compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/${GHCR_USERNAME:-hyunjoonkwak}/retirefarm-manager:${IMAGE_TAG:-latest}
    container_name: retirefarm-app
    restart: unless-stopped
    ports:
      - "3024:3000"
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=file:/app/prisma/data/retirefarm.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - GARAK_API_ID=${GARAK_API_ID}
      - GARAK_API_PASSWORD=${GARAK_API_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - EXTERNAL_PORTFOLIO_API_URL=${EXTERNAL_PORTFOLIO_API_URL}
      - EXTERNAL_PORTFOLIO_API_KEY=${EXTERNAL_PORTFOLIO_API_KEY}
      # 자산 허브 — 스냅샷 소비 + 매도 시뮬 프록시 (Asset Hub §2·§1.5.3, 읽기 전용).
      # 미설정 시 해당 기능만 비활성(무해). portfolio-backend는 127.0.0.1 바인딩이라
      # 네트워크 합류 후 컨테이너명 접근, asset(naver-crawler-web)은 NAS IP로 접근.
      - ASSET_MANAGER_URL=${ASSET_MANAGER_URL:-}
      - ASSET_MANAGER_SNAPSHOT_TOKEN=${ASSET_MANAGER_SNAPSHOT_TOKEN:-}
      - PORTFOLIO_MANAGER_URL=${PORTFOLIO_MANAGER_URL:-}
      - PORTFOLIO_MANAGER_SNAPSHOT_TOKEN=${PORTFOLIO_MANAGER_SNAPSHOT_TOKEN:-}
      # 브라우저 딥링크용 공개 URL (서버 컴포넌트에서 런타임 참조)
      - NEXT_PUBLIC_ASSET_MANAGER_URL=${NEXT_PUBLIC_ASSET_MANAGER_URL:-}
      - BACKUP_DIR=/backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${DATA_PATH:-./data}:/app/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - retirefarm-network
      # portfolio-backend가 127.0.0.1:8070에만 바인딩돼 있어 호스트 포트로는 접근 불가 —
      # portfolio compose의 네트워크에 합류해 컨테이너명으로 직접 호출한다 (my_portal과 동일).
      # 주의: portfolio 스택이 NAS에 없으면 up이 실패하므로 이 네트워크는 NAS 전용 전제.
      - portfolio-net

networks:
  retirefarm-network:
    driver: bridge
  portfolio-net:
    external: true
    name: portfolio_manager_portfolio-network
