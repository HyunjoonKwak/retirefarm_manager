# GHCR 이미지 기반 프로덕션 배포용 (NAS용)
# 사용법: docker-compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/${GHCR_USERNAME:-hyunjoonkwak}/retirefarm-manager:${IMAGE_TAG:-latest}
    container_name: retirefarm-app
    restart: unless-stopped
    ports:
      - "3024:3000"
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=file:/app/prisma/data/retirefarm.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - GARAK_API_ID=${GARAK_API_ID}
      - GARAK_API_PASSWORD=${GARAK_API_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - EXTERNAL_PORTFOLIO_API_URL=${EXTERNAL_PORTFOLIO_API_URL}
      - EXTERNAL_PORTFOLIO_API_KEY=${EXTERNAL_PORTFOLIO_API_KEY}
      - BACKUP_DIR=/backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${DATA_PATH:-./data}:/app/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - retirefarm-network

networks:
  retirefarm-network:
    driver: bridge
