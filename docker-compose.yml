version: '3.8'

services:
  app:
    build: .
    container_name: retirefarm-app
    restart: unless-stopped
    ports:
      - "3024:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/retirefarm
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - KAMIS_API_KEY=${KAMIS_API_KEY}
      - KAMIS_API_ID=${KAMIS_API_ID}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - retirefarm-network

  db:
    image: postgres:15-alpine
    container_name: retirefarm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=retirefarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - retirefarm-network

volumes:
  postgres_data:

networks:
  retirefarm-network:
    driver: bridge
